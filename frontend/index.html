<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>Campus Connect</title>

    <style>
      /* 2. Global CSS Fixes for Native Feel */
      :root {
        /* Safe area variables */
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
      }

      html, body {
        /* Screen ko 'Bounce' hone se rokne ke liye */
        position: fixed; 
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0a0410; /* Tumhara theme color taaki loading ke waqt white jhatka na lage */
      }

      #root {
        /* App container ko screen ke size ka banana */
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        /* Safe areas ke liye padding yahan base level par handle hogi */
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        box-sizing: border-box;
      }

      /* 3. Disable Long Press context menu (Optional, but gives native feel) */
      * {
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
